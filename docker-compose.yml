# Convenience only — Echoback needs no compose stack.
services:
  echoback:
    image: ghcr.io/attunesolutions/echoback:latest
    # Local build instead of the published image:
    # build:
    #   context: .
    #   args:
    #     MODELS: "small"
    container_name: echoback
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - echoback_data:/data
      # Bind mount instead, to keep jobs.db and secrets.json where you can see them.
      # The host directory keeps its own ownership, so it must be readable and
      # writable by uid 10001 — the unprivileged user in the image — or startup
      # fails with `PermissionError: [Errno 13] ... '/data/secrets.tmp'`:
      #   mkdir -p ./data && sudo chown -R 10001:10001 ./data
      # - ./data:/data
    # Configuration lives in .env — copy .env.example to .env and edit there.
    # Without this line Compose reads .env only for ${VAR} substitution in this
    # file; it does not pass anything to the container.
    env_file:
      - path: .env
        required: false
    # Anything set here overrides .env. Prefer .env; use this for one-off pins.
    # environment:
    #   LOG_LEVEL: debug

volumes:
  echoback_data:
