# Convenience only — Echoback needs no compose stack.
services:
  echoback:
    image: ghcr.io/attunesolutions/echoback:latest
    # Local build instead of the published image:
    # build:
    #   context: .
    #   args:
    #     MODELS: "small"
    container_name: echoback
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - echoback_data:/data
    environment:
      MODEL_DEFAULT: small
      LOG_LEVEL: info
      # Public URL your reverse proxy serves this on. Makes status_url absolute and
      # refuses a callback_url pointing back at this service.
      # HOST_URL: https://voicemail.example.com
      # Restrict where results may be POSTed (a leading dot matches subdomains).
      # Loopback and link-local are always refused; private LAN ranges are allowed.
      # CALLBACK_ALLOWED_HOSTS: activepieces.internal,.example.com
      # Default vocabulary hint for jobs that send none (domain vocabulary only —
      # per-call proper nouns belong in the request's vocabulary_hint field):
      # VOCABULARY_HINT: "invoice, purchase order, back-order, RMA, dispatch"
      # Supply your own secrets instead of the generated ones:
      # API_TOKEN: ...
      # WEBHOOK_SECRET: ...

volumes:
  echoback_data:
