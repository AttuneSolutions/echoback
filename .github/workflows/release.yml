name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the tag legs cut a GitHub Release
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for the arm64 leg)
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long
            type=edge,branch=main

      # The tag is the only place a version number lives. Untagged builds of main
      # are not releases, so they get a PEP 440 local version off the commit.
      - name: Resolve the package version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0+sha.${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      # whisper.cpp is compiled for both architectures; the arm64 leg runs under
      # QEMU and is slow. Layer cache keeps repeat builds tolerable.
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODELS=small
            VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Only version tags get a Release; pushes to main just move :edge.
      # Re-runnable: an existing Release for the tag is updated, not duplicated.
      - name: Cut the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${TAG#v}"
            echo '```'
            echo
            echo "Built for \`linux/amd64\` and \`linux/arm64\`, with a signed SBOM and"
            echo "build provenance attached."
            echo
            echo "Immutable digest:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } > /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --generate-notes \
              --verify-tag
          fi
