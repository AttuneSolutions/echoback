[project]
name = "echoback"
# Derived from the git tag by hatch-vcs — see [tool.hatch.version].
dynamic = ["version"]
description = "Offline voicemail transcription with a signed webhook callback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
echoback = "echoback.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# `git tag -a v1.2.3` is the whole release process. Builds without a readable
# .git — the Docker image, chiefly — take the version from
# SETUPTOOLS_SCM_PRETEND_VERSION instead.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/echoback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:echoback.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# ASYNC240: the files this service touches are voicemail-sized; a blocking stat or
# unlink on them is cheaper than dragging in an async filesystem layer.
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
# B008: call-in-default is how FastAPI declares File/Form/Depends parameters.
"src/echoback/api.py" = ["B008"]
